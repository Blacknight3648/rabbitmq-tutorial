version: '3.8'

services:
    

      
    rabbitmq:
      image: rabbitmq:4.2-management
      container_name: rabbitmq
      ports:
        - "5672:5672"
        - "15672:15672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q"]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  rabbitmq_data: